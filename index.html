<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="titulo">
        <h1>Calculadora Simples</h1>
    </div>
    <div class="flex">
        <label for="Numero01">1° Numero:</label>
        <input type="text" id = "Numero01" placeholder="Digite um número" autocomplete="off">
    
        <label for="Numero02">2° Numero:</label>
        <input type="text" id = "Numero02" placeholder="Digite um número" autocomplete="off">

    </div>
    <div id = "resultado_div">
        <label for="resultado">resultado: </label>
        <output id="resultado" type="number"></output>
    </div>
    <div class="flex">
    <div>
        <button onclick="add()">Soma</button>
    </div>
    <div>
        <button onclick="sub()">Subtração</button>
    </div>
    <div>
        <button onclick="mult()">Multiplicação</button>
    </div>
    <div>
        <button onclick="div()">Divisão</button>
    </div>
    <div>
        <button onclick="limpar_campos()">Limpar</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
